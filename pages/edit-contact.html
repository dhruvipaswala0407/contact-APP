<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Contact | Digital Contact Book</title>
  <meta name="description" content="Update and manage existing contact details in your digital register.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Ambient Shifting Glow Mesh -->
  <div class="ambient-glow" aria-hidden="true">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
    <div class="glow-orb glow-3"></div>
  </div>

  <!-- Sticky Glass Navigation Bar -->
  <div class="navbar-wrapper">
    <nav class="navbar" aria-label="Main Navigation">
      <a href="../index.html" class="nav-brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 2v4"></path>
            <path d="M8 2v4"></path>
            <rect width="18" height="18" x="3" y="4" rx="3"></rect>
            <circle cx="12" cy="11" r="3"></circle>
            <path d="M7 18a5 5 0 0 1 10 0"></path>
          </svg>
        </div>
        <span>Digital Contact Book</span>
      </a>

      <ul class="nav-links">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="contacts.html" class="nav-link">Contacts</a></li>
        <li><a href="add-contact.html" class="nav-link">Add Contact</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>

      <button type="button" class="mobile-toggle" id="mobile-toggle" aria-label="Toggle Navigation Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="18" x2="20" y2="18"></line>
        </svg>
      </button>
    </nav>
  </div>

  <!-- Mobile Dropdown Navigation -->
  <div class="mobile-menu" id="mobile-menu">
    <a href="../index.html" class="nav-link">Home</a>
    <a href="contacts.html" class="nav-link">Contacts</a>
    <a href="add-contact.html" class="nav-link">Add Contact</a>
    <a href="about.html" class="nav-link">About</a>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">

      <!-- Back Action -->
      <div style="margin-bottom: 20px;" class="fade-in">
        <a href="contacts.html" class="btn btn-sm btn-glass" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          Back to Directory
        </a>
      </div>

      <!-- Container: Form or Not Found State -->
      <div id="content-container">
        <!-- Injected via inline script -->
      </div>

    </div>
  </main>

  <!-- Sticky / Bottom Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div>&copy; 2026 Digital Contact Book &bull; Secure Browser Storage</div>
      <div class="footer-nav">
        <a href="../index.html">Home</a>
        <a href="contacts.html">Contacts</a>
        <a href="add-contact.html">Add Contact</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </footer>

  <!-- Small Inline Script for Editing & Storage -->
  <script>
    const DB_KEY = 'contact_register_db';

    function getContacts() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveContacts(arr) {
      localStorage.setItem(DB_KEY, JSON.stringify(arr));
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    }

    function isValidPhone(phone) {
      const clean = phone.replace(/[^\d+]/g, '');
      return clean.length >= 7 && clean.length <= 16;
    }

    function checkDuplicates(company, email, excludeId) {
      const contacts = getContacts();
      const normCompany = company.trim().toLowerCase();
      const normEmail = email.trim().toLowerCase();

      for (const c of contacts) {
        if (c.id === excludeId) continue;
        if ((c.companyName || '').trim().toLowerCase() === normCompany) {
          return { isDuplicate: true, field: 'company', message: `A contact for company "${c.companyName}" already exists.` };
        }
        if ((c.email || '').trim().toLowerCase() === normEmail) {
          return { isDuplicate: true, field: 'email', message: `A contact with email "${c.email}" already exists (${c.companyName}).` };
        }
      }
      return { isDuplicate: false };
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Mobile menu
      const toggle = document.getElementById('mobile-toggle');
      const menu = document.getElementById('mobile-menu');
      if (toggle && menu) {
        toggle.addEventListener('click', () => menu.classList.toggle('open'));
      }

      const params = new URLSearchParams(window.location.search);
      const contactId = params.get('id');
      const container = document.getElementById('content-container');

      if (!contactId) {
        renderNotFound(container, 'No contact identifier provided.');
        return;
      }

      const contacts = getContacts();
      const contact = contacts.find(c => c.id === contactId);

      if (!contact) {
        renderNotFound(container, `The contact with ID "${escapeHtml(contactId)}" was not found in your register.`);
        return;
      }

      renderEditForm(container, contact);
    });

    function renderNotFound(container, message) {
      container.innerHTML = `
        <div class="glass-panel empty-state fade-in">
          <div class="empty-icon-circle" style="color: var(--accent-rose); border-color: rgba(244, 63, 94, 0.3);">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
          </div>
          <h2 class="empty-title">Contact Not Found</h2>
          <p class="empty-text">${message}</p>
          <a href="contacts.html" class="btn btn-primary">Return to Directory</a>
        </div>
      `;
    }

    function renderEditForm(container, contact) {
      const safeCompany = escapeHtml(contact.companyName);
      const safeManager = escapeHtml(contact.managerName);
      const safePhone = escapeHtml(contact.phone);
      const safeEmail = escapeHtml(contact.email);

      container.innerHTML = `
        <div class="glass-panel form-box fade-in">
          <div style="margin-bottom: 28px;">
            <h1 class="section-title" style="font-size: 1.8rem; margin-bottom: 6px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-cyan);">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              Edit Contact
            </h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">
              Updating records for <strong style="color: var(--text-main);">${safeCompany}</strong>.
            </p>
          </div>

          <!-- Dynamic Warning Banner -->
          <div class="alert-banner alert-warning" id="warning-banner" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <div id="warning-banner-text">
              Warning: A contact with this Company Name or Email already exists.
            </div>
          </div>

          <form id="edit-form" novalidate>
            <!-- 1. Company Name -->
            <div class="form-field" id="field-company">
              <label for="companyName" class="field-label">
                Company Name <span class="required">*</span>
              </label>
              <div class="input-wrapper">
                <svg class="input-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="16" height="20" x="4" y="2" rx="2" ry="2"></rect>
                  <path d="M9 22v-4h6v4"></path>
                  <path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path>
                  <path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path>
                  <path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path>
                </svg>
                <input type="text" id="companyName" class="text-input" value="${safeCompany}" required autocomplete="organization">
              </div>
              <div class="field-error-msg" id="error-company">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>Please enter a valid company name (at least 2 characters).</span>
              </div>
            </div>

            <!-- 2. Manager Name -->
            <div class="form-field" id="field-manager">
              <label for="managerName" class="field-label">
                Manager Name <span class="required">*</span>
              </label>
              <div class="input-wrapper">
                <svg class="input-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="managerName" class="text-input" value="${safeManager}" required autocomplete="name">
              </div>
              <div class="field-error-msg" id="error-manager">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>Please enter the manager's name (at least 2 characters).</span>
              </div>
            </div>

            <!-- 3. Phone Number -->
            <div class="form-field" id="field-phone">
              <label for="phoneNumber" class="field-label">
                Phone Number <span class="required">*</span>
              </label>
              <div class="input-wrapper">
                <svg class="input-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                <input type="tel" id="phoneNumber" class="text-input" value="${safePhone}" required autocomplete="tel">
              </div>
              <div class="field-error-msg" id="error-phone">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>Please enter a valid phone number (at least 7 digits).</span>
              </div>
            </div>

            <!-- 4. Email Address -->
            <div class="form-field" id="field-email">
              <label for="emailAddress" class="field-label">
                Email Address <span class="required">*</span>
              </label>
              <div class="input-wrapper">
                <svg class="input-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
                <input type="email" id="emailAddress" class="text-input" value="${safeEmail}" required autocomplete="email">
              </div>
              <div class="field-error-msg" id="error-email">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>Please enter a valid email address.</span>
              </div>
            </div>

            <!-- Buttons -->
            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 30px;">
              <a href="contacts.html" class="btn btn-glass">Cancel</a>
              <button type="submit" class="btn btn-primary" id="btn-update">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Update Contact
              </button>
            </div>
          </form>
        </div>
      `;

      const form = document.getElementById('edit-form');
      const companyInput = document.getElementById('companyName');
      const managerInput = document.getElementById('managerName');
      const phoneInput = document.getElementById('phoneNumber');
      const emailInput = document.getElementById('emailAddress');
      const warningBanner = document.getElementById('warning-banner');
      const warningText = document.getElementById('warning-banner-text');

      function setFieldError(fieldId, hasError) {
        const el = document.getElementById(fieldId);
        if (hasError) el.classList.add('has-error');
        else el.classList.remove('has-error');
      }

      companyInput.addEventListener('input', () => {
        setFieldError('field-company', companyInput.value.trim().length < 2);
      });
      managerInput.addEventListener('input', () => {
        setFieldError('field-manager', managerInput.value.trim().length < 2);
      });
      phoneInput.addEventListener('input', () => {
        setFieldError('field-phone', !isValidPhone(phoneInput.value.trim()));
      });
      emailInput.addEventListener('input', () => {
        setFieldError('field-email', !isValidEmail(emailInput.value.trim()));
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const company = companyInput.value.trim();
        const manager = managerInput.value.trim();
        const phone = phoneInput.value.trim();
        const email = emailInput.value.trim();

        const isCompanyErr = company.length < 2;
        const isManagerErr = manager.length < 2;
        const isPhoneErr = !isValidPhone(phone);
        const isEmailErr = !isValidEmail(email);

        setFieldError('field-company', isCompanyErr);
        setFieldError('field-manager', isManagerErr);
        setFieldError('field-phone', isPhoneErr);
        setFieldError('field-email', isEmailErr);

        if (isCompanyErr || isManagerErr || isPhoneErr || isEmailErr) {
          return;
        }

        // Duplicate check (ignoring current contact)
        const dup = checkDuplicates(company, email, contact.id);
        if (dup.isDuplicate) {
          warningBanner.style.display = 'flex';
          warningText.textContent = `Duplicate Warning: ${dup.message}`;
          if (dup.field === 'company') setFieldError('field-company', true);
          if (dup.field === 'email') setFieldError('field-email', true);
          return;
        }

        // Update in localStorage
        const allContacts = getContacts();
        const idx = allContacts.findIndex(c => c.id === contact.id);
        if (idx !== -1) {
          allContacts[idx] = {
            ...allContacts[idx],
            companyName: company,
            managerName: manager,
            phone: phone,
            email: email
          };
          saveContacts(allContacts);
        }

        // Set pending toast and redirect
        sessionStorage.setItem('pending_contact_msg', `Updated contact for "${company}" successfully!`);
        window.location.href = 'contacts.html';
      });
    }
  </script>
</body>
</html>
